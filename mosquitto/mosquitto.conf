# Mosquitto MQTT Broker Configuration - Nexus-E Edge Stack
# MVP: Open auth for local sensor-to-broker connections
# Security boundary is at edge-to-cloud TLS (Story 1.4)

# =================================================================
# Listener
# =================================================================

# Listen on all interfaces within Docker network, port 1883
listener 1883
protocol mqtt

# MVP: Allow anonymous connections (sensors connect via local/physical interfaces)
allow_anonymous true

# =================================================================
# Persistence
# =================================================================

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 900

# Maximum queued messages per client (supports future buffering story 1.5)
max_queued_messages 10000
max_inflight_messages 40

# =================================================================
# Logging
# =================================================================

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# =================================================================
# Limits
# =================================================================

# Maximum publish payload size (256KB - sufficient for telemetry JSON)
message_size_limit 262144
