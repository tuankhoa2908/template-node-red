# Nexus-E Edge Gateway - Custom Health Alerts for Raspberry Pi 4
# Thresholds per Story 1.2 Task 4.3: CPU >90%, RAM >85%, disk >80%

alarm: nexus_cpu_usage
on: system.cpu
# Looks at the 5-minute average of CPU time (user, system, softirq, irq)
lookup: average -5m unaligned of user,system,softirq,irq
units: %
every: 1m
warn: $this > 90
crit: $this > 95
info: CPU usage is high on edge gateway

alarm: nexus_ram_usage
on: system.ram
calc: ($used) * 100 / ($used + $free + $cached + $buffers)
units: %
every: 1m
warn: $this > 85
crit: $this > 95
info: RAM usage is high on edge gateway

alarm: nexus_disk_usage
on: disk.space
lookup: max -1m unaligned of used
calc: ($this) * 100 / ($this + $avail)
units: %
every: 1m
warn: $this > 80
crit: $this > 90
info: Disk usage is high on edge gateway

alarm: nexus_disk_io_latency
on: disk_await.mmcblk0
lookup: average -5m unaligned of reads,writes
units: ms
every: 1m
warn: $this > 50
crit: $this > 100
info: Disk I/O latency is high on SD card (mmcblk0) — potential card degradation
