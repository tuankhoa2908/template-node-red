# Netdata Configuration - template-node-red-pi Edge Stack (Raspberry Pi 4)
# Hardware monitoring for CPU, RAM, disk, network, temperature

[global]
    hostname = template-node-red-pi-gateway
    update every = 5  # seconds
    memory mode = ram  # store metrics in RAM
    history = 3600  # Keeps 3600 data points in memory

# ! Security issue: Need to update before deployment
[web]
    bind to = 0.0.0.0:19999
    allow connections from = localhost 127.0.0.1 172.18.*
    allow dashboard from = localhost 127.0.0.1 172.18.*

[health]
    enabled = yes

[plugins]
    proc = yes
    cgroups = yes  # Monitors Docker container resource usage
    apps = no  # Disables per-process monitoring
    charts.d = no  # Disables shell-based collectors
    python.d = yes  # Enables Python-based collectors
