name: template-node-red-pi

services:
  mosquitto:
    image: "eclipse-mosquitto:2"
    profiles:
      - mqtt
    restart: always
    ports:
      - "127.0.0.1:1883:1883"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      - ${EDGE_PROJECT_DIR:-.}/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - template-node-red-pidge-net

  nodered:
    build:
      context: ${EDGE_PROJECT_DIR:-.}/nodered
      dockerfile: Dockerfile
    image: "template-node-red-pi-nodered:4.1.9"
    restart: always
    ports:
      - "${NODERED_BIND:-127.0.0.1}:1880:1880"  # Dev: set NODERED_BIND=0.0.0.0 to expose externally
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      TZ: ${TZ:-UTC}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:-}
      NODE_RED_ADMIN_USER: ${NODE_RED_ADMIN_USER:-}
      NODE_RED_ADMIN_PASSWORD: ${NODE_RED_ADMIN_PASSWORD:-}
      NODE_RED_ADMIN_PASS_HASH: ${NODE_RED_ADMIN_PASS_HASH:-}
    # Uncomment to enable serial/RS-485 access for Modbus RTU (Story 1.7)
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    volumes:
      - nodered-data:/data
      - ${EDGE_PROJECT_DIR:-.}/nodered/settings.js:/data/settings.js:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:1880/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - template-node-red-pidge-net

  netdata:
    image: "netdata/netdata:stable"
    profiles:
      - monitoring
    restart: always
    ports:
      - "127.0.0.1:19999:19999"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${EDGE_PROJECT_DIR:-.}/netdata/netdata.conf:/etc/netdata/netdata.conf:ro
      - ${EDGE_PROJECT_DIR:-.}/netdata/health.d/:/etc/netdata/health.d/:ro
    tmpfs:
      - /var/lib/netdata:size=50m
      - /var/cache/netdata:size=50m
      - /var/log:size=50m
    environment:
      NETDATA_LISTENER_PORT: "19999"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:19999/api/v1/info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - template-node-red-pidge-net

networks:
  template-node-red-pidge-net:
    name: template-node-red-pidge-net
    driver: bridge

volumes:
  mosquitto-data:
    name: template-node-red-pi-mosquitto-data
    driver: local
  mosquitto-log:  # Low-write: Mosquitto's own logs, kept on disk
    name: template-node-red-pi-mosquitto-log
    driver: local
  nodered-data:
    name: template-node-red-pi-nodered-data
    driver: local
